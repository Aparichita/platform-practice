apiVersion: apps/v1
kind: Deployment
metadata:
  name: practice-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: practice-api
  template:
    metadata:
      labels:
        app: practice-api
    spec:
      containers:
        - name: practice-api
          image: practice-api:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
